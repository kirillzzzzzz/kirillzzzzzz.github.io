<!doctype html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>phaser-learning</title>
  <script type="module" crossorigin src="/assets/index-z9o2F23S.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-BO7So_Li.css">
</head>

<body>

	<div id="early-debug" style="
		position: fixed;
		left: 10px;
		top: 10px;
		z-index: 999999;
		padding: 15px;
		background: black;
		color: #00ff00;
		font: 16px monospace;
		white-space: pre-wrap;
	">
		HTML: START
	</div>

	<script>
		const earlyDebug = document.getElementById('early-debug');

		function earlyLog(message) {
			earlyDebug.textContent += '\n' + message;
		}

		earlyLog('INLINE SCRIPT: OK');

		window.addEventListener('error', (event) => {
			earlyLog('ERROR: ' + (event.message || 'unknown error'));

			earlyLog(
				'FILE: ' +
				(event.filename || 'unknown')
			);

			earlyLog(
				'LINE: ' +
				(event.lineno || 'unknown') +
				' COL: ' +
				(event.colno || 'unknown')
			);

			if (event.error && event.error.stack) {
				earlyLog(
					'STACK:\n' +
					event.error.stack
				);
			}

			if (event.target && event.target.tagName) {
				earlyLog(
					'TARGET: ' +
					event.target.tagName +
					' ' +
					(event.target.src || '')
				);
			}
		});

		window.addEventListener('unhandledrejection', (event) => {
			earlyLog(
				'PROMISE ERROR: ' +
				String(event.reason)
			);
		});
	</script>


	<div id="app"></div>
</body>

</html>
